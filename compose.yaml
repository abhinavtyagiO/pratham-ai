services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pa
      POSTGRES_PASSWORD: pa_local
      POSTGRES_DB: pa
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pa_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pa -d pa"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pa_postgres:
